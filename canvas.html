<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixeltable Canvas</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #171717; color: #f5f5f5; }
    header { max-width: 1200px; margin: 0 auto 24px; display: flex; gap: 16px; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 24px; }
    #status { padding: 8px 12px; border-radius: 999px; background: #292929; color: #fbbf24; font-size: 14px; }
    #status.connected { color: #4ade80; }
    #status.failed { color: #f87171; }
    #canvas { max-width: 1200px; margin: 0 auto; display: grid; gap: 18px; }
    .item { padding: 20px; overflow: auto; border: 1px solid #383838; border-radius: 10px; background: #242424; }
    .item h2 { margin: 0 0 16px; font-size: 18px; }
    .item img, .item video { display: block; max-width: 100%; height: auto; border-radius: 6px; }
    .item audio { width: 100%; }
    .item pre { margin: 0; padding: 14px; overflow: auto; border-radius: 6px; background: #151515; white-space: pre-wrap; }
    .item iframe { width: 100%; min-height: 320px; border: 1px solid #444; border-radius: 6px; background: white; }
    .item table { width: 100%; border-collapse: collapse; }
    .item th, .item td { padding: 10px; border: 1px solid #444; text-align: left; vertical-align: top; }
    .item th { background: #303030; }
    .grid, .comparison { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .caption, .timestamp { margin-top: 8px; color: #a3a3a3; font-size: 12px; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <header>
    <h1>Pixeltable Canvas</h1>
    <div id="status">Connecting…</div>
  </header>
  <main id="canvas"></main>

  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const status = document.getElementById('status');
      const fragment = new URLSearchParams(window.location.hash.slice(1));
      const bearerToken = fragment.get('token');
      window.history.replaceState(null, '', '/canvas');

      function setStatus(message, className = '') {
        status.textContent = message;
        status.className = className;
      }

      async function setMediaSource(element, source) {
        if (typeof source !== 'string') throw new Error('Media source must be a string.');
        if (source.startsWith('/media/')) {
          const response = await fetch(source, {
            headers: { Authorization: `Bearer ${bearerToken}` },
            cache: 'no-store',
            credentials: 'omit'
          });
          if (!response.ok) throw new Error(`Media request failed (${response.status}).`);
          element.src = URL.createObjectURL(await response.blob());
          return;
        }
        element.src = source;
      }

      function appendError(parent, error) {
        const message = document.createElement('p');
        message.style.color = '#f87171';
        message.textContent = error instanceof Error ? error.message : String(error);
        parent.appendChild(message);
      }

      function appendMedia(parent, tagName, source) {
        const element = document.createElement(tagName);
        if (tagName === 'audio' || tagName === 'video') element.controls = true;
        parent.appendChild(element);
        setMediaSource(element, source).catch((error) => appendError(parent, error));
      }

      function formatValue(value) {
        if (value === null || value === undefined) return '';
        return typeof value === 'object' ? JSON.stringify(value) : String(value);
      }

      function appendTable(parent, rows) {
        if (!Array.isArray(rows) || rows.length === 0 || typeof rows[0] !== 'object') {
          appendError(parent, 'Table data must be a non-empty array of objects.');
          return;
        }
        const headers = Object.keys(rows[0]);
        const table = document.createElement('table');
        const headerRow = table.createTHead().insertRow();
        for (const header of headers) {
          const cell = document.createElement('th');
          cell.textContent = header;
          headerRow.appendChild(cell);
        }
        const body = table.createTBody();
        for (const row of rows) {
          const tableRow = body.insertRow();
          for (const header of headers) {
            const cell = tableRow.insertCell();
            const value = row[header];
            if (typeof value === 'string' && value.startsWith('/media/')) {
              const extension = value.split('?')[0].toLowerCase();
              if (/\.(png|jpe?g|gif|webp|bmp|tiff?)$/.test(extension)) appendMedia(cell, 'img', value);
              else if (/\.(mp3|wav|ogg|m4a|flac)$/.test(extension)) appendMedia(cell, 'audio', value);
              else if (/\.(mp4|webm|mov|m4v)$/.test(extension)) appendMedia(cell, 'video', value);
              else cell.textContent = formatValue(value);
            } else {
              cell.textContent = formatValue(value);
            }
          }
        }
        parent.appendChild(table);
      }

      function appendImageGrid(parent, entries) {
        if (!Array.isArray(entries)) {
          appendError(parent, 'Image-grid data must be an array.');
          return;
        }
        const grid = document.createElement('div');
        grid.className = 'grid';
        for (const entry of entries) {
          const wrapper = document.createElement('div');
          const source = typeof entry === 'object' && entry !== null ? entry.url : entry;
          appendMedia(wrapper, 'img', source);
          if (typeof entry === 'object' && entry !== null && entry.caption) {
            const caption = document.createElement('div');
            caption.className = 'caption';
            caption.textContent = String(entry.caption);
            wrapper.appendChild(caption);
          }
          grid.appendChild(wrapper);
        }
        parent.appendChild(grid);
      }

      function appendComparison(parent, comparison) {
        if (!comparison || typeof comparison !== 'object') {
          appendError(parent, 'Comparison data must be an object.');
          return;
        }
        const container = document.createElement('div');
        container.className = 'comparison';
        for (const side of ['left', 'right']) {
          const wrapper = document.createElement('div');
          const label = document.createElement('strong');
          label.textContent = String(comparison[`${side}Label`] || side.toUpperCase());
          wrapper.appendChild(label);
          const content = comparison[side] || {};
          if (content.type === 'image') appendMedia(wrapper, 'img', content.data);
          else {
            const text = document.createElement('p');
            text.textContent = formatValue(content.data);
            wrapper.appendChild(text);
          }
          container.appendChild(wrapper);
        }
        parent.appendChild(container);
      }

      function render(message) {
        if (!message || message.type === 'connected') return;
        const item = document.createElement('section');
        item.className = 'item';
        if (message.title) {
          const heading = document.createElement('h2');
          heading.textContent = String(message.title);
          item.appendChild(heading);
        }

        switch (message.content_type) {
          case 'image': appendMedia(item, 'img', message.data); break;
          case 'video': appendMedia(item, 'video', message.data); break;
          case 'audio': appendMedia(item, 'audio', message.data); break;
          case 'table': appendTable(item, message.data); break;
          case 'image_grid': appendImageGrid(item, message.data); break;
          case 'comparison': appendComparison(item, message.data); break;
          case 'text': {
            const paragraph = document.createElement('p');
            paragraph.textContent = String(message.data);
            item.appendChild(paragraph);
            break;
          }
          default: {
            const pre = document.createElement('pre');
            pre.textContent = typeof message.data === 'string'
              ? message.data
              : JSON.stringify(message.data, null, 2);
            item.appendChild(pre);
          }
        }
        const timestamp = document.createElement('div');
        timestamp.className = 'timestamp';
        timestamp.textContent = new Date().toLocaleTimeString();
        item.appendChild(timestamp);
        canvas.prepend(item);
      }

      async function connect() {
        if (!bearerToken) {
          setStatus('Missing access token', 'failed');
          return;
        }
        try {
          const response = await fetch('/canvas/stream', {
            headers: { Authorization: `Bearer ${bearerToken}` },
            cache: 'no-store',
            credentials: 'omit'
          });
          if (!response.ok || !response.body) throw new Error(`Connection failed (${response.status}).`);
          setStatus('Connected', 'connected');
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true }).replace(/\r/g, '');
            let boundary;
            while ((boundary = buffer.indexOf('\n\n')) >= 0) {
              const event = buffer.slice(0, boundary);
              buffer = buffer.slice(boundary + 2);
              const payload = event.split('\n')
                .filter((line) => line.startsWith('data:'))
                .map((line) => line.slice(5).trimStart())
                .join('\n');
              if (payload) render(JSON.parse(payload));
            }
          }
          throw new Error('Canvas stream closed.');
        } catch (error) {
          setStatus(error instanceof Error ? error.message : 'Disconnected', 'failed');
          window.setTimeout(connect, 1500);
        }
      }

      connect();
    })();
  </script>
</body>
</html>
