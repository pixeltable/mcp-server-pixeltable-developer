[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-pixeltable-developer"
version = "0.2.0"
description = "A local developer MCP server for Pixeltable applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["mcp", "pixeltable", "ai", "data", "multimodal", "machine-learning"]
authors = [
    {name = "Identimoji", email = "help@identimoji.io"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.2,<3",
    "packaging>=24",
    "pixeltable[serve]>=0.7.6,<0.8",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
# Optional browser canvas used by pixeltable_unsafe_display.
canvas = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]
test = [
    "build>=1.2",
    "mcp[cli]>=2.2,<3",
    "pyright>=1.1.405",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
]
[project.urls]
"Homepage" = "https://github.com/pixeltable/mcp-server-pixeltable-developer"
"Bug Tracker" = "https://github.com/pixeltable/mcp-server-pixeltable-developer/issues"

[project.scripts]
mcp-server-pixeltable-developer = "mcp_server_pixeltable_developer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/mcp_server_pixeltable_developer",
    "src/mcp_server_pixeltable_stio",
]

[tool.hatch.build.targets.wheel.shared-data]
"canvas.html" = "share/mcp-server-pixeltable-developer/canvas.html"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/canvas.html",
    "/docs",
    "/evals",
    "/scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: end-to-end smoke tests that initialize a real Pixeltable catalog (opt-in via --run-slow)",
]
filterwarnings = [
    "ignore:Field name \"schema\".*shadows.*:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
